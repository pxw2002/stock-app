<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F6F8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="股票记账">
<meta name="application-name" content="股票记账">
<meta name="app-build" content="v4 · 2026-10-29">
<link rel="apple-touch-icon" sizes="180x180" href="app-icon.png">
<link rel="icon" type="image/png" sizes="180x180" href="app-icon.png">
<title>股票记账 · 分红计划</title>
<style>
:root{
  --bg:#F5F6F8; --card:#FFFFFF; --text:#14171F; --sub:#8A8F99; --line:#EFF1F4;
  --orange:#F5822C; --orange-2:#FFB067; --orange-soft:#FFF3E8;
  --up:#E4402F; --down:#12A050; --chip:#F2F4F7;
  --r:16px; --r-lg:18px;
  --shadow:0 1px 8px rgba(17,24,39,.06), 0 0 1px rgba(17,24,39,.05);
  --warn:#8A5A00; --warn-bg:#FFF6E5; --warn-line:#F3DFB0;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-text-size-adjust:100%}
body{padding-bottom:calc(118px + env(safe-area-inset-bottom))}
b{font-weight:600}
.up{color:var(--up)}.down{color:var(--down)}.orange{color:var(--orange)}.muted{color:var(--sub)}

/* 顶栏 */
.topbar{position:sticky;top:0;z-index:20;display:grid;grid-template-columns:44px 1fr 44px;
  align-items:center;gap:4px;padding:12px 12px 10px;background:rgba(245,246,248,.92);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.topbar .tt{text-align:center;min-width:0}
.topbar h1{margin:0;font-size:17px;font-weight:600;letter-spacing:.3px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .sub{font-size:11px;color:var(--sub);margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:44px;height:36px;border:0;background:transparent;color:var(--text);
  display:flex;align-items:center;justify-content:center;border-radius:12px;font-size:15px;
  font-family:inherit;cursor:pointer}
.iconbtn:active{background:rgba(20,23,31,.06)}
.iconbtn svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round}

.wrap{max-width:900px;margin:0 auto;padding:2px 14px 20px}
@media(min-width:900px){.wrap{max-width:720px}}

/* 汇总卡 */
.sum{background:linear-gradient(135deg,#FFB86F 0%,#F5822C 100%);border-radius:var(--r-lg);
  box-shadow:0 8px 22px rgba(245,130,44,.24);padding:16px;margin-top:6px;color:#fff}
.sum .k{font-size:12px;color:rgba(255,255,255,.88)}
.sum .v{font-size:27px;font-weight:700;letter-spacing:-.6px;font-variant-numeric:tabular-nums;margin:3px 0}
.sum .s{font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums}
.sum-grid{display:grid;grid-template-columns:repeat(3,1fr);margin-top:14px;padding-top:12px;
  border-top:1px solid rgba(255,255,255,.26)}
.sum-grid>div{text-align:center;position:relative}
.sum-grid>div+div:before{content:'';position:absolute;left:0;top:3px;bottom:3px;width:1px;
  background:rgba(255,255,255,.26)}
.sum-grid .k{display:block;font-size:11px;color:rgba(255,255,255,.88);margin-bottom:4px}
.sum-grid .v{font-size:14px;font-weight:700;color:#fff}

/* 卡片 / 股票卡 */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow)}
.cards{display:flex;flex-direction:column;gap:12px}
.stock{padding:14px}
.srow1{display:flex;align-items:center;gap:10px}
.avatar{flex:0 0 auto;width:38px;height:38px;border-radius:12px;background:var(--chip);
  display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:600;color:#3B4252}
.sname{flex:1;min-width:0}
.sname b{display:block;font-size:16px;letter-spacing:.2px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.sname span{display:block;font-size:11px;color:var(--sub);margin-top:2px}
.shero{flex:0 0 auto;text-align:right}
.shero b{display:block;font-size:19px;font-weight:700;letter-spacing:-.3px;font-variant-numeric:tabular-nums}
.shero span{display:block;font-size:11px;color:var(--sub);margin-top:2px}
.metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-top:12px}
.metrics>div{background:var(--orange-soft);border-radius:11px;padding:7px 2px;text-align:center;min-width:0}
.metrics .k{display:block;font-size:10px;color:#A9764A;margin-bottom:4px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.metrics .v{font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.metrics .v.orange{color:#C26512}
.metrics .v.up{color:var(--up)}
.metrics .v.down{color:var(--down)}
.pb{display:flex;align-items:center;gap:8px;margin-top:11px}
.pb .track{flex:1;height:4px;border-radius:3px;background:#EDEFF3;overflow:hidden}
.pb i{display:block;height:100%;border-radius:3px;min-width:6px;
  background:linear-gradient(90deg,var(--orange-2),var(--orange))}
.pb .t{flex:0 0 auto;font-size:11px;color:var(--sub);font-variant-numeric:tabular-nums}

/* 列表 */
.listrow{display:flex;align-items:center;gap:10px;padding:12px 14px}
.listrow+.listrow{border-top:1px solid var(--line)}
.listrow .mid{flex:1;min-width:0}
.listrow .t1{font-size:14.5px;display:flex;align-items:center;gap:7px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.listrow .t2{font-size:11.5px;color:var(--sub);margin-top:3px;font-variant-numeric:tabular-nums;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.listrow .amt{flex:0 0 auto;text-align:right;font-size:15px;font-weight:600;
  font-variant-numeric:tabular-nums}
.yearhead{display:flex;align-items:baseline;justify-content:space-between;padding:0 4px 8px;
  font-size:12.5px;color:var(--sub)}
.yearhead b{font-size:14px;color:var(--text)}
.totalbar{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;
  font-size:13px;color:var(--sub)}
.totalbar b{font-size:15px;color:var(--text);font-variant-numeric:tabular-nums}
.tag{display:inline-block;border-radius:7px;padding:1.5px 7px;font-size:11px;font-weight:400}
.tag.blue{background:#E8F1FF;color:#2457C5}
.tag.orange{background:var(--orange-soft);color:#C26512}
.tag.green{background:#E6F6EC;color:#0E8A4C}
.sec-title{font-size:13px;color:var(--sub);margin:16px 4px 8px;display:flex;
  align-items:center;justify-content:space-between}
.rows{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.row2{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 14px;font-size:14px}
.row2+.row2{border-top:1px solid var(--line)}
.row2 .k{color:var(--sub);font-size:13px}
.row2 .v{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.empty{padding:30px 20px;text-align:center;color:var(--sub);font-size:13.5px;
  background:var(--card);border-radius:var(--r);box-shadow:var(--shadow)}
.sortrow{display:flex;gap:8px;overflow-x:auto;padding:0 0 10px;
  scrollbar-width:none;-ms-overflow-style:none}
.sortrow::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:0;background:var(--chip);color:var(--sub);border-radius:14px;
  padding:6px 12px;font-size:12.5px;cursor:pointer;font-family:inherit}
.chip.on{background:var(--orange-soft);color:var(--orange);font-weight:600}
.pendbox{border-radius:var(--r);background:var(--warn-bg);border:1px solid var(--warn-line);
  color:var(--warn);padding:12px 14px;font-size:13px;line-height:1.6;margin-top:12px}
.pendbox b{font-size:15px}
.pendbox .ln{font-size:12px;color:#9A6A10;margin-top:4px;font-variant-numeric:tabular-nums}

/* FAB + 底部导航 */
.fab{position:fixed;right:16px;bottom:calc(78px + env(safe-area-inset-bottom));z-index:25;
  border:0;border-radius:26px;background:linear-gradient(135deg,#FFA855,#F5822C);color:#fff;
  font-size:14.5px;font-weight:600;padding:13px 19px;font-family:inherit;
  box-shadow:0 8px 20px rgba(245,130,44,.4);cursor:pointer}
.fab:active{transform:scale(.96)}
.fab[disabled]{opacity:.5}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;
  background:rgba(255,255,255,.97);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 7px;
  color:var(--sub);text-decoration:none;font-size:11px}
.tabbar a.on{color:var(--text);font-weight:600}
.tabbar .ic{width:34px;height:20px;display:flex;align-items:center;justify-content:center;border-radius:10px}
.tabbar a.on .ic{background:var(--orange-soft)}
.tabbar svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round}

/* 录入面板 */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--card);
  border-top-left-radius:20px;border-top-right-radius:20px;
  box-shadow:0 -10px 34px rgba(0,0,0,.18);transform:translateY(105%);
  transition:transform .24s ease;max-height:90vh;overflow:auto;
  padding-bottom:env(safe-area-inset-bottom)}
.sheet.on{transform:translateY(0)}
.sheet .hd{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px;
  position:sticky;top:0;background:var(--card);border-radius:20px 20px 0 0}
.sheet .hd b{font-size:16px}
.sheet .bd{padding:0 16px 22px}
.seg{display:flex;gap:8px;margin:8px 0 4px}
.seg button{flex:1;border:0;background:var(--chip);color:var(--sub);border-radius:12px;
  padding:10px 0;font-size:14px;font-family:inherit;cursor:pointer}
.seg button.on{background:var(--orange-soft);color:var(--orange);font-weight:600}
.row{display:flex;gap:10px;align-items:center;margin:10px 0}
.row label{font-size:13px;color:var(--sub);min-width:56px}
.row input,.row select{flex:1;border:0;background:var(--chip);border-radius:12px;
  padding:12px 12px;font-size:15px;color:var(--text);outline:none;min-width:0;font-family:inherit}
.row input:focus,.row select:focus{background:#EDF0F4}
.fee{font-size:12px;color:var(--sub);line-height:1.65;background:var(--chip);
  border-radius:12px;padding:10px 12px;margin:10px 0}
button.primary{width:100%;border:0;border-radius:14px;padding:14px 0;font-size:15px;font-weight:600;
  background:linear-gradient(135deg,#FFA855,#F5822C);color:#fff;font-family:inherit;cursor:pointer}
button.primary[disabled]{opacity:.55}
button.ghost{border:0;background:var(--chip);border-radius:12px;padding:10px 16px;font-size:14px;
  color:var(--text);font-family:inherit;cursor:pointer}
.hint{font-size:12px;color:var(--sub);line-height:1.75}
.warnbox{background:var(--warn-bg);border:1px solid var(--warn-line);color:var(--warn);
  border-radius:12px;padding:10px 12px;font-size:12px;line-height:1.7;margin:10px 0}
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));
  transform:translateX(-50%);background:#14171F;color:#fff;border-radius:20px;padding:10px 16px;
  font-size:13px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;
  max-width:86vw;text-align:center}
.toast.on{opacity:.95}
.hidden{display:none !important}

/* 可点卡片 */
.stock{cursor:pointer;transition:transform .12s ease}
.stock:active{transform:scale(.985)}
.chev{flex:0 0 auto;color:#C6CAD2;display:flex;align-items:center}
.chev svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.3;
  stroke-linecap:round;stroke-linejoin:round}

/* 股票详情 */
.dhero{padding:15px 14px 13px}
.dhero .top{display:flex;align-items:center;gap:10px}
.dhero .px{font-size:26px;font-weight:700;letter-spacing:-.6px;
  font-variant-numeric:tabular-nums;margin-top:10px;line-height:1.15}
.dhero .px small{font-size:12px;font-weight:500;color:var(--sub);margin-left:8px;letter-spacing:0}
.dgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:12px}
.dgrid>div{background:var(--orange-soft);border-radius:12px;padding:8px 3px;text-align:center;min-width:0}
.dgrid .k{display:block;font-size:10px;color:#A9764A;margin-bottom:3px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dgrid .v{font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.actrow{display:flex;gap:8px;margin-top:13px}
.actrow button{flex:1;border:0;border-radius:12px;padding:11px 0;font-size:14px;font-weight:600;
  font-family:inherit;cursor:pointer;background:var(--chip);color:var(--text)}
.actrow button.main{background:linear-gradient(135deg,#FFA855,#F5822C);color:#fff;
  box-shadow:0 6px 14px rgba(245,130,44,.3)}
.listrow.tap{cursor:pointer}
.listrow.tap:active{background:#F7F9FB}
.zebra{font-size:10.5px;color:#B0571A;background:#FFF0E4;border-radius:6px;padding:1px 6px;margin-left:6px}
button.danger{width:100%;border:0;border-radius:14px;padding:13px 0;font-size:15px;font-weight:600;
  background:#FFF1EF;color:var(--up);font-family:inherit;cursor:pointer}
button.danger.arm{background:var(--up);color:#fff}

/* 新版本提示条 */
.vbar{position:fixed;left:0;right:0;top:0;z-index:70;background:#14171F;color:#fff;
  font-size:13px;padding:10px 14px;display:flex;align-items:center;gap:10px;
  justify-content:space-between;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.vbar button{border:0;background:#fff;color:#14171F;border-radius:12px;padding:7px 14px;
  font-size:13px;font-weight:600;font-family:inherit;cursor:pointer}
</style>
</head>
<body>

<header class="topbar">
  <button class="iconbtn" id="btnSetupIcon" aria-label="设置">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 3.5v2M12 18.5v2M3.5 12h2M18.5 12h2M6 6l1.4 1.4M16.6 16.6L18 18M18 6l-1.4 1.4M7.4 16.6L6 18"/></svg>
  </button>
  <div class="tt"><h1 id="pageTitle">我的持仓</h1><div class="sub" id="pageSub">—</div></div>
  <button class="iconbtn" id="btnRefreshIcon" aria-label="刷新">
    <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 11-2.6-5.9"/><path d="M20 4v4h-4"/></svg>
  </button>
</header>

<main class="wrap" id="view"></main>

<button class="fab" id="fab">＋ 记一笔</button>

<nav class="tabbar" id="tabbar">
  <a href="#/home" data-tab="home"><span class="ic"><svg viewBox="0 0 24 24"><path d="M5 20V10"/><path d="M12 20V4"/><path d="M19 20v-6"/></svg></span>持仓</a>
  <a href="#/div" data-tab="div"><span class="ic"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5v9M9.6 10.2h3.6a1.9 1.9 0 010 3.8H9.6"/></svg></span>分红</a>
  <a href="#/led" data-tab="led"><span class="ic"><svg viewBox="0 0 24 24"><path d="M4 6.5h16M4 12h16M4 17.5h10"/></svg></span>流水</a>
  <a href="#/me" data-tab="me"><span class="ic"><svg viewBox="0 0 24 24"><circle cx="12" cy="9" r="3.4"/><path d="M5 20c.9-3.5 3.6-5.2 7-5.2s6.1 1.7 7 5.2"/></svg></span>设置</a>
</nav>

<!-- 录入面板 -->
<div class="sheet" id="sheet">
  <div class="hd"><b id="sheetTitle">记一笔</b><button class="ghost" id="btnClose">关闭</button></div>
  <div class="bd">
    <div class="seg" id="segMode">
      <button data-mode="hold" class="on">已有持仓</button>
      <button data-mode="new">新股票（新建持仓）</button>
    </div>
    <div class="seg" id="segType">
      <button data-type="买入" class="on">买入</button>
      <button data-type="卖出">卖出</button>
      <button data-type="分红">分红</button>
    </div>

    <div id="holdPick">
      <div class="row"><label>股票</label><select id="fStock"></select></div>
    </div>
    <div id="newPick" class="hidden">
      <div class="row"><label>代码</label><input id="fNewCode" inputmode="numeric" placeholder="600036 或 sh600036" autocapitalize="off" autocorrect="off"></div>
      <div class="row"><label>名称</label><input id="fNewName" placeholder="例如 招商银行"></div>
      <div class="hint" id="newHint">新建持仓 = 首次买入。电脑入账时会自动在表格里插入这只股票（含公式与合计行）。</div>
    </div>

    <div class="row"><label id="lblShares">股数</label><input id="fShares" type="number" inputmode="decimal" placeholder="例如 100"></div>
    <div class="row"><label id="lblPrice">价格</label><input id="fPrice" type="number" inputmode="decimal" step="0.001" placeholder="留空则入账时自动拉价"></div>
    <div class="row"><label>日期</label><input id="fDate" type="date"></div>
    <div class="row"><label>备注</label><input id="fNote" placeholder="可不填"></div>
    <div class="fee" id="feeBox">费用预估：-</div>
    <button class="primary" id="btnSubmit">提交到云端队列</button>
    <div class="hint" style="margin-top:10px" id="submitHint">提交后：云端每天 15:05 自动入账（也可以点「立即更新云端」马上处理），入账后刷新本页即可看到最新持仓。</div>
  </div>
</div>

<!-- 修正 / 删除 流水 -->
<div class="sheet" id="editSheet">
  <div class="hd"><b id="editTitle">修正这笔流水</b><button class="ghost" id="btnEditClose">关闭</button></div>
  <div class="bd">
    <div class="hint" id="editSub" style="margin-bottom:2px">—</div>
    <div id="editForm">
      <div class="seg" id="segEType">
        <button data-et="买入" class="on">买入</button>
        <button data-et="卖出">卖出</button>
        <button data-et="分红">分红</button>
      </div>
      <div class="row"><label id="eLblShares">股数</label><input id="eShares" type="number" inputmode="decimal"></div>
      <div class="row"><label id="eLblPrice">价格</label><input id="ePrice" type="number" inputmode="decimal" step="0.001"></div>
      <div class="row"><label>日期</label><input id="eDate" type="date"></div>
      <div class="row"><label>备注</label><input id="eNote"></div>
      <div class="fee" id="eFee">—</div>
    </div>
    <div style="display:flex;gap:10px;margin-top:12px" id="editBtns">
      <button class="primary" id="btnEditSave" style="flex:1">保存修正</button>
      <button class="ghost" id="btnEditDel" style="color:var(--up)">删除</button>
    </div>
    <div style="margin-top:12px" class="hidden" id="editCancelWrap">
      <button class="danger" id="btnEditCancel">撤销这笔交易</button>
      <div class="hint" style="margin-top:8px">撤销后这笔不会入账，也不需要电脑参与。</div>
    </div>
    <div class="warnbox" id="eWarn">修正/删除会同步调整这只股票的持仓股数、每股成本与已分红。提交后自动触发云端入账，约 1-2 分钟后刷新即可看到。</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
'use strict';

/* ============ 工具 ============ */
var $ = function(id){ return document.getElementById(id); };
var CFG_KEY = 'stockAppCfg.v1';
var QUEUE = 'queue.json';
var SNAP = 'snapshot.json';

function num(v){ var n = Number(v); return isFinite(n) ? n : 0; }
function money(v, d){
  var n = num(v), dd = (d == null ? 2 : d);
  return '¥' + n.toLocaleString('zh-CN', {minimumFractionDigits:dd, maximumFractionDigits:dd});
}
function moneyS(v){
  var n = num(v);
  return (n > 0 ? '+' : n < 0 ? '-' : '') + '¥' +
    Math.abs(n).toLocaleString('zh-CN', {minimumFractionDigits:2, maximumFractionDigits:2});
}
function moneyW(v){
  var n = num(v), a = Math.abs(n);
  if (a < 10000) return money(n);
  return (n < 0 ? '-' : '') + '¥' + (a / 10000).toFixed(2) + '万';
}
function pctS(v){ var n = num(v) * 100; return (n > 0 ? '+' : '') + n.toFixed(2) + '%'; }
function pctP(v){ return num(v).toFixed(2) + '%'; }
function sharesFmt(v){ var n = num(v); return Number.isInteger(n) ? String(n) : n.toLocaleString('zh-CN',{maximumFractionDigits:4}); }
function priceFmt(v){ var n = num(v); if (!n) return '—'; return n.toFixed(4).replace(/\.?0+$/, ''); }
function signCls(v){ return num(v) > 0 ? 'up' : (num(v) < 0 ? 'down' : ''); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function avatarOf(name){ var t = String(name||'').replace(/^[*]/,'').trim(); return t ? t.charAt(0) : '股'; }
function toast(msg){ var t = $('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(t._t); t._t = setTimeout(function(){ t.classList.remove('on'); }, 2800); }
function sleep(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }
function parseDay(s){ var m = /^(\d{4})-(\d{1,2})-(\d{1,2})/.exec(String(s||'')); return m ? new Date(+m[1], +m[2]-1, +m[3]) : null; }

/* 代码规范化: 600036 -> sh600036 (与电脑端 cloud-sync.ps1 规则一致) */
function normCode(raw){
  var c = String(raw||'').trim().toLowerCase().replace(/\.(sh|ss|sz|bj)$/,'');
  if (/^(sh|sz|bj)\d{6}$/.test(c)) return c;
  if (/^\d{6}$/.test(c)) {
    if (/^[69]/.test(c)) return 'sh' + c;
    if (/^[023]/.test(c)) return 'sz' + c;
  }
  return c;
}

/* UTF-8 base64 (兼容中文) */
function b64enc(str){
  var bytes = new TextEncoder().encode(str), bin = '';
  for (var i=0;i<bytes.length;i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin);
}
function b64dec(b64){
  var bin = atob(String(b64||'').replace(/\s/g,'')), bytes = new Uint8Array(bin.length);
  for (var i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}

/* ============ GitHub 内容 API ============ */
function ghHeaders(c){ return { Authorization: 'Bearer ' + c.token, Accept: 'application/vnd.github+json' }; }
function ghRepo(c){
  var url = 'https://api.github.com/repos/' + encodeURIComponent(c.owner) + '/' + encodeURIComponent(c.repo);
  return fetch(url, { headers: ghHeaders(c), cache: 'no-store' }).then(function(r){
    if (r.status === 401) throw new Error('Token 无效或已过期');
    if (r.status === 404) throw new Error('仓库不存在或无权限：请确认用户名/仓库名，且 Token 已勾选该仓库 Contents 读写');
    if (r.status === 403) throw new Error('权限不足或被限速（HTTP 403）');
    if (!r.ok) return r.text().then(function(t){ throw new Error('检查仓库失败 HTTP ' + r.status + ' ' + String(t).slice(0,100)); });
    return r.json();
  });
}
function ghGet(c, path){
  var url = 'https://api.github.com/repos/' + encodeURIComponent(c.owner) + '/' + encodeURIComponent(c.repo)
    + '/contents/' + path + '?ref=' + encodeURIComponent(c.branch || 'main');
  return fetch(url, { headers: ghHeaders(c), cache: 'no-store' }).then(function(r){
    if (r.status === 404) return null;
    if (!r.ok) return r.text().then(function(t){ throw new Error('读取 ' + path + ' 失败 HTTP ' + r.status + ' ' + t.slice(0,120)); });
    return r.json().then(function(j){ return { text: b64dec(j.content), sha: j.sha }; });
  });
}
function ghPut(c, path, text, sha){
  var body = { message: 'mobile ' + new Date().toISOString(), content: b64enc(text), branch: c.branch || 'main' };
  if (sha) body.sha = sha;
  var url = 'https://api.github.com/repos/' + encodeURIComponent(c.owner) + '/' + encodeURIComponent(c.repo)
    + '/contents/' + path;
  return fetch(url, { method:'PUT', headers: Object.assign(ghHeaders(c), { 'Content-Type':'application/json' }), body: JSON.stringify(body) })
    .then(function(r){
      if (!r.ok) return r.text().then(function(t){ throw new Error('写入 ' + path + ' 失败 HTTP ' + r.status + ' ' + t.slice(0,120)); });
      return r.json();
    });
}

/* ============ 业务逻辑 ============ */
function computeFee(type, amount, code){
  var isSH = String(code||'').toLowerCase().indexOf('sh') === 0;
  var commission = Math.max(amount * 0.0001, 5);
  var transfer = isSH ? Math.round(amount * 0.00001 * 100)/100 : 0;
  var stamp = type === '卖出' ? Math.round(amount * 0.0005 * 100)/100 : 0;
  var fee = Math.round((commission + transfer + stamp)*100)/100;
  var parts = ['佣金' + (Math.round(commission*100)/100)];
  if (stamp > 0) parts.push('印花税' + stamp);
  if (transfer > 0) parts.push('过户费' + transfer);
  return { fee: fee, note: parts.join('+') };
}
function newId(){ return 'm' + Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function nowStr(){ return new Date().toISOString().slice(0,19).replace('T',' '); }

/* 往云端队列追加一条(交易或修正操作)。op 缺省 = add */
function pushQueue(item){
  var c = loadCfg();
  if (!cfgReady(c)) return Promise.reject(new Error('请先完成连接设置'));
  var attempt = 0;
  function tryOnce(){
    attempt++;
    return ghGet(c, QUEUE).then(function(cur){
      var q = null;
      if (cur && cur.text && cur.text.trim()) { try { q = JSON.parse(cur.text); } catch(e){ q = null; } }
      if (!q) q = { version: 1, updatedAt: '', trades: [] };
      if (!Array.isArray(q.trades)) q.trades = [];
      q.trades.push(item);
      q.updatedAt = new Date().toISOString();
      return ghPut(c, QUEUE, JSON.stringify(q, null, 1), cur ? cur.sha : '').then(function(){ return q; });
    }).catch(function(err){
      if (attempt >= 3) throw err;
      return sleep(900).then(tryOnce);
    });
  }
  return tryOnce();
}

function submitTrade(trade){ return pushQueue(trade); }

var state = { snap:null, queue:null, stocks:[], ledger:[], T:null, divs:[], sortK:'annualTotal', ledType:'all',
              curHash:'', prevHash:'' };

function applySnapshot(snapshot){
  state.snap = snapshot;
  var stocks = (snapshot && snapshot.stocks) ? snapshot.stocks : [];
  var ledger = (snapshot && snapshot.ledger) ? snapshot.ledger : [];
  var TODAY = parseDay(snapshot && snapshot.generated) || new Date();

  ledger.forEach(function(e, i){
    e.shares = num(e.shares); e.price = num(e.price); e.amount = num(e.amount); e.fee = num(e.fee);
    e._d = parseDay(e.date);
    e._i = i;                                  // 在 state.ledger 里的下标(用于点击定位)
    e.row = (e.row == null || e.row === '') ? null : num(e.row);   // Excel 行号(云端新版本快照才有)
  });

  stocks.forEach(function(s){
    s.shares = num(s.shares); s.cost = num(s.cost); s.price = num(s.price);
    s.yieldPct = num(s.yieldPct); s.annualDiv = num(s.annualDiv); s.divReceived = num(s.divReceived);
    s.costValue = s.shares * s.cost;
    s.marketValue = s.shares * s.price;
    s.profit = s.marketValue - s.costValue;
    s.profitPct = s.costValue ? s.profit / s.costValue : 0;
    s.annualTotal = s.annualDiv * s.shares;
    s.originalCost = s.costValue + s.divReceived;
    s.priceGain = s.marketValue - s.originalCost;
    s.priceGainPct = s.originalCost ? s.priceGain / s.originalCost : 0;
    s.costYieldPct = s.cost ? s.annualDiv / s.cost * 100 : 0;
    s.paybackPct = s.originalCost ? s.divReceived / s.originalCost * 100 : 0;
    s.remaining = s.costValue;
    s.paybackYears = s.annualTotal > 0 ? s.remaining / s.annualTotal : null;
    var mine = ledger.filter(function(e){ return String(e.code) === String(s.code); });
    var buys = mine.filter(function(e){ return String(e.type||'').indexOf('买入') >= 0 && e._d; })
                   .sort(function(a,b){ return a._d - b._d; });
    s.holdDays = buys.length ? Math.max(0, Math.round((TODAY - buys[0]._d) / 86400000)) : null;
    s.tradeCount = mine.length;
  });

  state.stocks = stocks;
  state.ledger = ledger;
  state.divs = ledger.filter(function(e){ return String(e.type||'').indexOf('分红') >= 0; })
    .sort(function(a,b){ return String(b.date||'').localeCompare(String(a.date||'')); });

  var T = {costValue:0, marketValue:0, profit:0, divReceived:0, originalCost:0, priceGain:0, annualTotal:0};
  stocks.forEach(function(s){ for (var k in T) T[k] += num(s[k]); });
  T.profitPct = T.costValue ? T.profit / T.costValue : 0;
  T.priceGainPct = T.originalCost ? T.priceGain / T.originalCost : 0;
  T.paybackPct = T.originalCost ? T.divReceived / T.originalCost * 100 : 0;
  state.T = T;
}

var quoteState = { live:false, at:'', tried:false };

function secidOf(code){
  var c = String(code||'').toLowerCase();
  if (c.indexOf('sh') === 0) return '1.' + c.slice(2);
  if (c.indexOf('sz') === 0) return '0.' + c.slice(2);

var jsonpSeq = 0;
function jsonp(url, timeoutMs){
  return new Promise(function(resolve, reject){
    var name = 'cb_q' + (++jsonpSeq) + '_' + Date.now().toString(36);
    var done = false;
    function cleanup(){
      try { delete window[name]; } catch(e){ window[name] = undefined; }
      var el = document.getElementById(name);
      if (el && el.parentNode) el.parentNode.removeChild(el);
      clearTimeout(timer);
    }
    var timer = setTimeout(function(){ if (done) return; done = true; cleanup(); reject(new Error('超时')); }, timeoutMs || 6000);
    window[name] = function(data){ if (done) return; done = true; cleanup(); resolve(data); };
    var s = document.createElement('script');
    s.id = name;
    s.src = url + (url.indexOf('?') >= 0 ? '&' : '?') + 'cb=' + name;
    s.onerror = function(){ if (done) return; done = true; cleanup(); reject(new Error('网络错误')); };
    (document.head || document.body).appendChild(s);
  });
}

// 东财 push2: f43 是放大 100 倍的整数(42.52 -> 4252)
function fetchOneQuote(stock){
  var sid = secidOf(stock.code);
  if (!sid) return Promise.reject(new Error('无法识别代码'));
  var url = 'https://push2.eastmoney.com/api/qt/stock/get?secid=' + sid + '&fields=f43,f57,f58';
  return jsonp(url, 6000).then(function(j){
    if (!j || !j.data) throw new Error('无数据');
    var raw = Number(j.data.f43);
    if (!isFinite(raw) || raw <= 0) throw new Error('价格无效');
    return Math.round(raw) / 100;
  });
}

// 只重算"依赖价格"的派生指标, 不动台账相关字段
function applyLiveQuotes(){
  var T = {costValue:0, marketValue:0, profit:0, divReceived:0, originalCost:0, priceGain:0, annualTotal:0};
  state.stocks.forEach(function(s){
    s.costValue = s.shares * s.cost;
    s.originalCost = s.costValue + s.divReceived;
    s.marketValue = s.shares * s.price;
    s.profit = s.marketValue - s.costValue;
    s.profitPct = s.costValue ? s.profit / s.costValue : 0;
    s.priceGain = s.marketValue - s.originalCost;
    s.priceGainPct = s.originalCost ? s.priceGain / s.originalCost : 0;
    s.vsCostPct = s.cost ? (s.price - s.cost) / s.cost : 0;
    s.remaining = s.costValue;
    s.paybackPct = s.originalCost ? s.divReceived / s.originalCost * 100 : 0;
    s.paybackYears = s.annualTotal > 0 ? s.remaining / s.annualTotal : null;
  });
  state.stocks.forEach(function(s){ for (var k in T) T[k] += num(s[k]); });
  T.profitPct = T.costValue ? T.profit / T.costValue : 0;
  T.priceGainPct = T.originalCost ? T.priceGain / T.originalCost : 0;
  T.paybackPct = T.originalCost ? T.divReceived / T.originalCost * 100 : 0;
  state.T = T;
}

function fetchQuotes(){
  var list = state.stocks.filter(function(s){ return secidOf(s.code); });
  if (!list.length) return Promise.resolve(false);
  var ok = 0;
  return Promise.all(list.map(function(s){
    return fetchOneQuote(s).then(function(p){
      s.priceLive = p; s.price = p; ok++;
      return true;
    }).catch(function(){ return false; });
  })).then(function(){
    quoteState.tried = true;
    if (ok === 0) { quoteState.live = false; return false; }
    quoteState.live = true;
    var d = new Date();
    quoteState.at = (d.getMonth()+1) + '.' + d.getDate() + ' ' + ('0'+d.getHours()).slice(-2) + ':' + ('0'+d.getMinutes()).slice(-2);
    applyLiveQuotes();
    return true;
  });
}

// 让云端立刻跑一次 (GitHub Actions workflow_dispatch)
function triggerCloudRun(btn){
  var c = loadCfg();
  if (!cfgReady(c)) { toast('请先在「设置」里填写连接信息'); return; }
  if (btn) { btn.disabled = true; btn.textContent = '触发中...'; }
  var url = 'https://api.github.com/repos/' + encodeURIComponent(c.owner) + '/' + encodeURIComponent(c.repo)
    + '/actions/workflows/daily.yml/dispatches';
  fetch(url, {
    method: 'POST',
    headers: Object.assign(ghHeaders(c), { 'Content-Type': 'application/json' }),
    body: JSON.stringify({ ref: c.branch || 'main' })
  }).then(function(r){
    if (r.status === 204) {
      toast('已触发云端任务，约 1-2 分钟后刷新即可看到结果');
      setTimeout(function(){ refreshData(); }, 75000);
      return null;
    }
    return r.text().then(function(t){
      if (r.status === 403 || r.status === 404) {
        throw new Error('触发失败(HTTP ' + r.status + ')：Token 需要 workflow 权限，请重新生成 token 并勾选 repo + workflow');
      }
      throw new Error('触发失败 HTTP ' + r.status + ' ' + String(t).slice(0, 80));
    });
  }).catch(function(e){ toast(e.message); })
    .then(function(){ if (btn) { btn.disabled = false; btn.textContent = '立即更新云端'; } });
}

function bindLedgerRows(){

      var t = arr[num(this.getAttribute('data-pendi'))];
      if (t) openEditPending(t);
    });

}

/* ============ 修正 / 删除 流水 ============ */
var editTarget = null;      // { mode:'ledger', entry } | { mode:'pending', trade }
var editType = '买入';
var armTimer = null;

function targetOf(e){
  return { row: (e.row == null ? null : e.row), code: e.code, name: e.name,
           type: e.type, date: e.date, shares: num(e.shares), price: num(e.price) };
}

function openEditLedger(e){
  if (!cfgReady(loadCfg())) { toast('请先在「设置」里填写连接信息'); return; }
  editTarget = { mode: 'ledger', entry: e };
  var typ = String(e.type||'');
  editType = typ.indexOf('卖出')>=0 ? '卖出' : (typ.indexOf('分红')>=0 ? '分红' : '买入');
  $('editTitle').textContent = '修正这笔流水';
  $('editSub').textContent = (e.date||'') + ' · ' + (e.name||e.code) + ' · ' + (e.type||'');
  $('editForm').classList.remove('hidden');
  $('editBtns').classList.remove('hidden');
  $('editCancelWrap').classList.add('hidden');
  $('eWarn').classList.remove('hidden');
  $('eShares').value = (e.shares ? e.shares : '');
  $('ePrice').value = (e.price ? e.price : '');
  $('eDate').value = String(e.date||'').slice(0,10);
  $('eNote').value = e.note || '';
  setEType(editType);
  disarm($('btnEditDel'), '删除');
  $('btnEditSave').disabled = false;
  $('btnEditSave').textContent = '保存修正';
  $('editSheet').classList.add('on');
}

function openEditPending(t){
  editTarget = { mode: 'pending', trade: t };
  $('editTitle').textContent = '这笔还没入账';
  $('editSub').textContent = opName(t) + ' · ' + (t.name||t.code) + (t.shares ? ' · ' + sharesFmt(t.shares) + '股' : '') +
    (t.price ? ' @' + priceFmt(t.price) : '') + (t.date ? ' · ' + t.date : '');
  $('editForm').classList.add('hidden');
  $('editBtns').classList.add('hidden');
  $('editCancelWrap').classList.remove('hidden');
  $('eWarn').classList.add('hidden');
  disarm($('btnEditCancel'), '撤销这笔交易');
  $('editSheet').classList.add('on');
}

function closeEdit(){
  $('editSheet').classList.remove('on');
  editTarget = null;
}

function setEType(t){
  editType = t;
  var bs = document.querySelectorAll('#segEType button');
  for (var i=0;i<bs.length;i++) bs[i].classList.toggle('on', bs[i].getAttribute('data-et') === t);
  updateEditFee();
}

function updateEditFee(){
  if (!editTarget || editTarget.mode !== 'ledger') return;
  var sh = num($('eShares').value);
  var px = num($('ePrice').value);
  var e = editTarget.entry;
  var code = e.code || '';
  if (editType === '分红'){
    $('eLblShares').textContent = '持股数';
    $('eLblPrice').textContent = '每股派息';
    $('eFee').innerHTML = (!sh || !px) ? '分红入账 = 股数 × 每股派息，同时摊薄每股成本；无交易费用。'
      : '分红入账 <b>' + money(Math.round(sh*px*100)/100) + '</b>（' + sharesFmt(sh) + '股 × 每股 ' + priceFmt(px) + '），同时把每股成本摊薄 ' + priceFmt(px) + ' 元。';
  } else {
    $('eLblShares').textContent = '股数';
    $('eLblPrice').textContent = '价格';
    if (!sh || !px){ $('eFee').textContent = '填写股数和价格后自动计算费用'; }
    else {
      var amt = Math.round(sh*px*100)/100;
      var f = computeFee(editType, amt, code);
      $('eFee').innerHTML = '成交额 ' + money(amt) + '，费用 <b>' + money(f.fee) + '</b>（' + esc(f.note) + '）';
    }
  }
}

/* 危险按钮两段式确认: 第一下变成"再按一次", 4 秒没按就复原 */
function disarm(btn, label){
  if (!btn) return;
  btn.classList.remove('arm');
  btn.textContent = label;
  btn._armed = false;
}
function armOrRun(btn, label){
  if (!btn) return false;
  if (!btn._armed){
    btn._armed = true;
    btn.classList.add('arm');
    btn.textContent = '再按一次确认';
    clearTimeout(armTimer);
    armTimer = setTimeout(function(){ disarm(btn, label); }, 4000);
    return false;
  }
  clearTimeout(armTimer);
  disarm(btn, label);
  return true;
}

function saveEdit(){
  var t = editTarget;
  if (!t || t.mode !== 'ledger') return;
  var e = t.entry;
  var sh = num($('eShares').value);
  var px = num($('ePrice').value);
  if (!sh || sh <= 0){ toast(editType === '分红' ? '请填持股数（分红 = 持股数 × 每股派息）' : '股数要大于 0'); return; }
  if (!px || px <= 0){ toast(editType === '分红' ? '每股派息要大于 0' : '价格要大于 0'); return; }
  var d = $('eDate').value || String(e.date||'').slice(0,10);
  var note = $('eNote').value.trim();
  var same = (editType === String(e.type||'')) &&
             Math.abs(sh - num(e.shares)) < 1e-6 &&
             Math.abs(px - num(e.price)) < 1e-6 &&
             d === String(e.date||'').slice(0,10) &&
             note === String(e.note||'');
  if (same){ toast('内容没有改动'); return; }
  if (editType === '卖出'){
    var s = findStock(e.code);
    if (s && sh > num(s.shares) + 1e-6){ toast('卖出股数超过当前持仓 ' + sharesFmt(s.shares) + ' 股'); return; }
  }
  var op = { id: newId(), op: 'fix', at: nowStr(), target: targetOf(e),
             newType: editType, newShares: sh, newPrice: px, newDate: d, newNote: note };
  submitOp(op, $('btnEditSave'), '修正');
}

function deleteEdit(){
  var t = editTarget;
  if (!t || t.mode !== 'ledger') return;
  if (!armOrRun($('btnEditDel'), '删除')) return;
  var op = { id: newId(), op: 'void', at: nowStr(), target: targetOf(t.entry) };
  submitOp(op, $('btnEditDel'), '删除');
}

function cancelPendingTrade(){
  var t = editTarget;
  if (!t || t.mode !== 'pending') return;
  if (!armOrRun($('btnEditCancel'), '撤销这笔交易')) return;
  var op = { id: newId(), op: 'cancel', at: nowStr(), targetId: t.trade.id };
  submitOp(op, $('btnEditCancel'), '撤销');
}

function submitOp(op, btn, label){
  var old = btn ? btn.textContent : '';
  if (btn){ btn.disabled = true; btn.textContent = '提交中...'; }
  pushQueue(op).then(function(q){
    state.queue = q;
    if (btn){ btn.disabled = false; btn.textContent = old; }
    closeEdit();
    toast(label + '已提交，正在触发云端处理…');
    refreshData();
    triggerCloudRun(null);        // 顺手让云端立刻跑一次；1-2 分钟后自动刷新
  }).catch(function(err){
    if (btn){ btn.disabled = false; btn.textContent = old; }
    toast('提交失败：' + err.message);
  });
}

      '</div>' +
    '</div>' +
    '<div class="sec-title"><span>数据信息</span></div>' +
    '<div class="rows">' +
      '<div class="row2"><span class="k">行情日期</span><span class="v">' + esc(snap.quoteDate || '—') + '</span></div>' +
      '<div class="row2"><span class="k">快照更新</span><span class="v">' + esc(snap.generated || '—') + '</span></div>' +
      '<div class="row2"><span class="k">股票数量</span><span class="v">' + state.stocks.length + ' 只</span></div>' +
      '<div class="row2"><span class="k">流水记录</span><span class="v">' + state.ledger.length + ' 笔</span></div>' +
      '<div class="row2"><span class="k">待入账</span><span class="v">' + pendingTrades().length + ' 笔</span></div>' +
    '</div>' +
    '<div class="sec-title"><span>口径</span></div>' +
    '<div class="rows">' +
      '<div class="row2"><span class="k">预测年分红</span><span class="v">年化每股 × 股数</span></div>' +
      '<div class="row2"><span class="k">成本息率</span><span class="v">年化每股 ÷ 每股成本</span></div>' +
      '<div class="row2"><span class="k">净投入</span><span class="v">成本市值 + 已分红</span></div>' +
      '<div class="row2"><span class="k">分红回本进度</span><span class="v">已分红 ÷ 净投入</span></div>' +
    '</div>' +
    '<div class="hint" style="margin:16px 4px 0">新建持仓：在「＋ 记一笔」里选“新股票”，填代码+名称+股数+价格即可；电脑入账时会自动在 Excel 里插入这只股票（带公式和合计行）。</div>' +
    '<div class="hint" style="margin:10px 4px 0;text-align:center;opacity:.7">界面版本 ' + esc(BUILD) + '</div>';

  setCfgInputs(c);
  $('btnRefresh2').onclick = function(){ toast('刷新中...'); refreshData(); };
  $('btnSaveCfg').onclick = saveAndTest;
  $('btnClearCfg').onclick = function(){
    try { localStorage.removeItem(CFG_KEY); } catch(e){}
    cfg = null; loadCfg(); renderMe(); toast('已清除本机设置');
  };
  var bc = $('btnCloudRun');
  if (bc) bc.onclick = function(){ triggerCloudRun(this); };
  var bl = $('btnLiveQuote');
  if (bl) bl.onclick = function(){
    var self = this;
    self.disabled = true; self.textContent = '拉取中...';
    toast('正在拉实时行情...');
    fetchQuotes().then(function(got){
      self.disabled = false; self.textContent = '拉实时价';
      if (got) { toast('实时价已更新（' + quoteState.at + '）'); renderMe(); }
      else toast('没拉到实时价，先看收盘价；可能是网络被拦');
    });
  };
}
function setCfgInputs(c){
  if ($('cfgOwner')) $('cfgOwner').value = c.owner || '';
  if ($('cfgRepo')) $('cfgRepo').value = c.repo || 'stock-data';
  if ($('cfgBranch')) $('cfgBranch').value = c.branch || 'main';
  if ($('cfgToken')){
    $('cfgToken').value = '';   // 不回显; 留空即保持原值
    $('cfgToken').placeholder = c.token ? '已保存，留空则不修改' : 'ghp_... 或 github_pat_...';
  }
}
function saveAndTest(){
  var typed = $('cfgToken').value.trim();
  if (typed.indexOf('已保存') === 0) typed = '';
  var old = loadCfg().token || '';
  var c = {
    owner: $('cfgOwner').value.trim(),
    repo: $('cfgRepo').value.trim() || 'stock-data',
    branch: $('cfgBranch').value.trim() || 'main',
    token: typed || old
  };
  if (!c.owner) { toast('请填写 GitHub 用户名'); return; }
  if (!c.token) { toast('请填写 Token（ghp_ 开头那串）'); return; }
  saveCfg(c);
  toast('正在测试连接...');
  var branchWarn = '';
  ghRepo(c).then(function(repo){
    var def = repo && repo.default_branch ? repo.default_branch : 'main';
    if (c.branch !== def) branchWarn = '（注意：仓库默认分支是 ' + def + '，你填的是 ' + c.branch + '）';
    return ghGet(c, QUEUE);
  }).then(function(r){
    toast('连接成功' + (r ? '，已读取云端队列' : '（队列文件还没建，首次提交会自动创建）') + branchWarn);
    refreshData();
  }).catch(function(e){ toast('连接失败：' + e.message); });
}

/* ============ 录入 ============ */
var formType = '买入';
var formMode = 'hold';

function openSheet(code, type){
  // 作为按钮回调时第一个参数是事件对象, 忽略掉
  if (code && typeof code === 'object') { code = null; type = null; }
  if (!cfgReady(loadCfg())) { toast('请先在「设置」里填写 GitHub 连接信息'); location.hash = '#/me'; renderMe(); setupOpen = true; renderMe(); return; }
  $('sheet').classList.add('on');
  if (!state.stocks.length) refreshData();
  fillStockSelect();
  $('fDate').value = todayStr();
  $('fShares').value = '';
  $('fPrice').value = '';
  $('fNote').value = '';
  $('fNewCode').value = '';
  $('fNewName').value = '';
  setMode('hold');
  if (code){
    var opt = $('fStock').querySelector('option[value="' + String(code).replace(/"/g,'') + '"]');
    if (opt) $('fStock').value = code;
  }
  setType(type || '买入');
  updateFee();
}
function closeSheet(){ $('sheet').classList.remove('on'); }
function todayStr(){
  var d = new Date(), m = d.getMonth()+1, dd = d.getDate();
  return d.getFullYear() + '-' + (m<10?'0':'') + m + '-' + (dd<10?'0':'') + dd;
}
function setMode(m){
  formMode = m;
  document.querySelectorAll('#segMode button').forEach(function(b){ b.classList.toggle('on', b.getAttribute('data-mode') === m); });
  $('holdPick').classList.toggle('hidden', m !== 'hold');
  $('newPick').classList.toggle('hidden', m !== 'new');
  // 新建持仓只能是买入
  document.querySelectorAll('#segType button').forEach(function(b){
    var lock = (m === 'new' && b.getAttribute('data-type') !== '买入');
    b.disabled = lock;
    b.style.opacity = lock ? .4 : 1;
  });
  if (m === 'new') setType('买入');
  updateFee();
}
function setType(t){
  formType = t;
  document.querySelectorAll('#segType button').forEach(function(b){ b.classList.toggle('on', b.getAttribute('data-type') === t); });
  updateFee();
}
function fillStockSelect(){
  var sel = $('fStock');
  var cur = sel.value;
  sel.innerHTML = state.stocks.map(function(s){
    return '<option value="' + esc(s.code) + '">' + esc(s.name) + ' (' + esc(s.code) + ')</option>';
  }).join('');
  if (cur && sel.querySelector('option[value="' + cur + '"]')) sel.value = cur;
  sel.onchange = updateFee;
}
function chosenStock(){
  var code = $('fStock').value;
  for (var i=0;i<state.stocks.length;i++) if (state.stocks[i].code === code) return state.stocks[i];
  return null;
}
function currentCode(){
  if (formMode === 'new') return normCode($('fNewCode').value);
  return $('fStock').value || '';
}
function updateFee(){
  var s = (formMode === 'hold') ? chosenStock() : null;
  var sh = num($('fShares').value);
  var pxRaw = $('fPrice').value;
  var px = num(pxRaw) || (s ? num(s.price) : 0);
  var box = $('feeBox');
  var code = currentCode();

  if (formType === '分红'){
    $('lblShares').textContent = '持股数';
    $('lblPrice').textContent = '每股派息';
    $('fShares').placeholder = s ? ('留空=当前持仓 ' + sharesFmt(s.shares) + ' 股') : '填写持股数';
    box.innerHTML = '分红入账 = 股数 × 每股派息，同时摊薄每股成本；不产生交易费用。';
  } else {
    $('lblShares').textContent = '股数';
    $('lblPrice').textContent = '价格';
    $('fShares').placeholder = '例如 100';
    $('fPrice').placeholder = s ? ('留空=入账时拉最新价（快照 ' + priceFmt(s.price) + '）') : '留空则入账时自动拉价';
    if (!sh || !px){ box.textContent = '费用预估：填写股数和价格后自动计算'; }
    else {
      var amount = Math.round(sh*px*100)/100;
      var f = computeFee(formType, amount, code);
      box.innerHTML = '成交额 ' + money(amount) + '，费用 <b>' + money(f.fee) + '</b>（' + esc(f.note) + '）<br>' +
        (formType === '买入' ? '入账后按摊薄成本更新持仓' : '入账后扣减股数');
    }
  }
  if (formMode === 'new'){
    $('newHint').innerHTML = '新建持仓 = 首次买入' + (code ? '，代码将规范为 <b>' + esc(code) + '</b>' : '') +
      '<br>电脑入账时会自动在 Excel 里插入这只股票（含公式与合计行）。';
  }
}

function submitForm(){
  var c = loadCfg();
  if (!cfgReady(c)) { toast('请先完成连接设置'); return; }

  var code, name, s = null;
  if (formMode === 'new'){
    code = normCode($('fNewCode').value);
    name = $('fNewName').value.trim();
    if (!/^(sh|sz|bj)\d{6}$/.test(code)) { toast('请填写正确的 6 位股票代码'); return; }
    if (!name) { toast('请填写股票名称（新建持仓必须填）'); return; }
    var exist = state.stocks.filter(function(x){ return String(x.code) === code; })[0];
    if (exist) { toast('该代码已在持仓里（' + exist.name + '），请用「已有持仓」'); return; }
  } else {
    s = chosenStock();
    if (!s) { toast('请选择股票'); return; }
    code = s.code; name = s.name;
  }

  var shares = num($('fShares').value);
  if (formType === '分红'){
    if (!shares || shares <= 0){ if (s && s.shares > 0) shares = s.shares; else { toast('分红需填写持股数'); return; } }
  }
  if (!shares || shares <= 0) { toast('请填写股数'); return; }

  var price = $('fPrice').value === '' ? null : num($('fPrice').value);
  if (formMode === 'new' && (!price || price <= 0)) { toast('新建持仓建议填写成交价（留空则入账时自动拉价）'); }
  if (formType === '卖出' && s && shares > s.shares) { toast('卖出股数超过持仓 ' + sharesFmt(s.shares) + ' 股'); return; }

  var trade = {
    id: newId(),
    at: new Date().toISOString().slice(0,19).replace('T',' '),
    type: formMode === 'new' ? '买入' : formType,
    code: code,
    name: name,
    shares: shares,
    price: price,
    date: $('fDate').value || todayStr(),
    note: ($('fNote').value || (formMode === 'new' ? '手机新建持仓' : '手机录入'))
  };

  var btn = $('btnSubmit');
  btn.disabled = true; btn.textContent = '提交中...';
  submitTrade(trade).then(function(q){
    state.queue = q;
    closeSheet();
    var n = q.trades.filter(function(t){ return !t.applied; }).length;
    toast('已提交，待入账 ' + n + ' 笔');
    refreshData();
    btn.disabled = false; btn.textContent = '提交到云端队列';
  }).catch(function(err){
    btn.disabled = false; btn.textContent = '提交到云端队列';
    toast('提交失败：' + err.message);
  });
}

function pendingTrades(){
  var q = state.queue;
  var trades = (q && Array.isArray(q.trades)) ? q.trades : [];
  return trades.filter(function(t){ return t && !t.applied && !t.cancelled; });
}
function opName(t){
  var o = String((t && t.op) || 'add').toLowerCase();
  if (o === 'fix') return '修正';
  if (o === 'void') return '删除';
  if (o === 'cancel') return '撤销';
  return '入账';
}

/* ============ 数据加载 ============ */
function refreshData(){
  var c = loadCfg();
  if (!cfgReady(c)){ state.stocks = []; state.ledger = []; state.divs = []; renderMe(); setupOpen = true; renderMe(); return; }
  var p1 = ghGet(c, SNAP).then(function(r){ return r ? JSON.parse(r.text) : null; }).catch(function(e){ return { __err: e.message }; });
  var p2 = ghGet(c, QUEUE).then(function(r){ return r && r.text.trim() ? JSON.parse(r.text) : { version:1, trades:[] }; }).catch(function(e){ return { __err: e.message }; });
  return Promise.all([p1,p2]).then(function(res){
    var snap = res[0], queue = res[1];
    if (snap && snap.__err){ toast('读取快照失败：' + snap.__err); snap = null; }
    if (queue && queue.__err){ toast('读取队列失败：' + queue.__err); queue = null; }
    state.queue = queue || { version:1, trades:[] };
    if (snap) applySnapshot(snap);
    else { state.stocks = []; state.ledger = []; state.divs = []; }
    route();
    // 顺手拉一次实时价(手机自己拉, 不依赖电脑); 失败就继续用快照里的收盘价
    try {
      fetchQuotes().then(function(got){
        if (got && (location.hash === '' || location.hash === '#/home')) route();
      }).catch(function(){ });
    } catch(e){ }
  });
}

/* ============ 路由 ============ */
var ICON_GEAR = null;
var ICON_BACK = '<svg viewBox="0 0 24 24"><path d="M14.5 5.5L8.5 12l6 6.5"/></svg>';

function setLeftBtn(mode){
  var b = $('btnSetupIcon');
  if (!b) return;
  if (!ICON_GEAR) ICON_GEAR = b.innerHTML;
  if (mode === 'back'){ b.innerHTML = ICON_BACK; b.setAttribute('aria-label','返回'); b._mode = 'back'; }
  else { b.innerHTML = ICON_GEAR; b.setAttribute('aria-label','设置'); b._mode = 'gear'; }
}
function goBack(){
  var back = (state.prevHash && state.prevHash.charAt(0) === '#') ? state.prevHash : '#/home';
  if (back === location.hash) back = '#/home';
  location.hash = back;
}

function route(){
  var cur = location.hash || '#/home';
  if (state.curHash !== cur){ state.prevHash = state.curHash; state.curHash = cur; }
  var h = String(location.hash || '').replace(/^#\/?/,'');
  var parts = h.split('/').filter(function(x){ return x; });
  var name = parts[0] || 'home';
  setLeftBtn('gear');
  if (name === 's' && parts[1]){
    renderStock(decodeURIComponent(parts[1]));
    setTab('');
    setLeftBtn('back');
  }
  else if (name === 'div'){ renderDiv(); setTab('div'); }
  else if (name === 'led'){ renderLed(); setTab('led'); }
  else if (name === 'me'){ renderMe(); setTab('me'); }
  else { renderHome(); setTab('home'); }
  try { window.scrollTo(0,0); } catch(e){}
}

/* ============ 初始化 ============ */
function boot(){
  loadCfg();
  state.curHash = location.hash || '#/home';
  $('fab').onclick = function(){ openSheet(); };
  $('btnClose').onclick = closeSheet;
  $('btnSubmit').onclick = submitForm;
  $('btnRefreshIcon').onclick = function(){ toast('刷新中...'); refreshData(); };
  $('btnSetupIcon').onclick = function(){
    if (this._mode === 'back') { goBack(); return; }
    location.hash = '#/me'; renderMe(); setupOpen = true; renderMe();
  };
  document.querySelectorAll('#segMode button').forEach(function(b){
    b.onclick = function(){ setMode(b.getAttribute('data-mode')); };
  });
  document.querySelectorAll('#segType button').forEach(function(b){
    b.onclick = function(){ if (b.disabled) return; setType(b.getAttribute('data-type')); };
  });
  ['fShares','fPrice','fStock','fNewCode','fNewName'].forEach(function(id){
    var el = $(id); if (el) el.addEventListener('input', updateFee);
  });
  // 修正面板
  $('btnEditClose').onclick = closeEdit;
  $('btnEditSave').onclick = saveEdit;
  $('btnEditDel').onclick = deleteEdit;
  $('btnEditCancel').onclick = cancelPendingTrade;
  document.querySelectorAll('#segEType button').forEach(function(b){
    b.onclick = function(){ setEType(b.getAttribute('data-et')); };
  });
  ['eShares','ePrice'].forEach(function(id){
    var el = $(id); if (el) el.addEventListener('input', updateEditFee);
  });
  window.addEventListener('hashchange', route);
  if (cfgReady(cfg)) refreshData(); else { route(); renderMe(); setupOpen = true; renderMe(); }
  setTimeout(checkNewVersion, 1200);
}
document.addEventListener('DOMContentLoaded', boot);

/* 供测试使用 */
window.__app = {
  computeFee: computeFee, newId: newId, submitTrade: submitTrade, pushQueue: pushQueue,
  loadCfg: loadCfg, ghRepo: ghRepo, normCode: normCode, applySnapshot: applySnapshot, state: state,
  renderHome: renderHome, renderDiv: renderDiv, renderLed: renderLed, renderMe: renderMe,
  renderStock: renderStock, route: route, openEditLedger: openEditLedger, openEditPending: openEditPending,
  targetOf: targetOf, pendingTrades: pendingTrades, findStock: findStock, ledgerOf: ledgerOf,
  saveEdit: saveEdit, deleteEdit: deleteEdit, cancelPendingTrade: cancelPendingTrade, setEType: setEType
};
})();
</script>
